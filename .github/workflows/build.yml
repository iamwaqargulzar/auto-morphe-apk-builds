name: Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id to build (empty = all enabled apps)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the release already exists"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        run: echo "matrix=$(npm run -s apkb -- plan ${APP:+--app "$APP"})" >> "$GITHUB_OUTPUT"
        env:
          APP: ${{ inputs.app }}

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"app":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.app }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .cache/tools
          key: tools-${{ github.run_id }}
          restore-keys: tools-
      - run: npm ci
      - name: Build ${{ matrix.app }}
        run: npm run -s apkb -- build "${{ matrix.app }}" ${FORCE:+--force}
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Google Play account for downloads. The anonymous token service
          # rejects GitHub's IPs, so these are required on Actions.
          GOOPDL_ACCOUNT_EMAIL: ${{ secrets.GOOPDL_ACCOUNT_EMAIL }}
          GOOPDL_AAS_TOKEN: ${{ secrets.GOOPDL_AAS_TOKEN }}
      # Version codes learned from Google Play; merged and committed below.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codes-${{ matrix.app }}
          path: state/version-codes.json
          retention-days: 1
          if-no-files-found: ignore

  record:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: codes-*
          path: .cache/codes
      - run: npm run -s apkb -- merge-codes .cache/codes/*/version-codes.json
      - name: Commit learned version codes
        run: |
          git diff --quiet -- state/ && exit 0
          git config user.name "Waqar Gulzar"
          git config user.email "96654715+iamwaqargulzar@users.noreply.github.com"
          git add state/
          git commit -m "Record Google Play version codes"
          git push
