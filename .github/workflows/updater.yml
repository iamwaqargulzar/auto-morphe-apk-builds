name: Updater app

on:
  push:
    branches: [main]
    paths: ["updater/**", ".github/workflows/updater.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: v
        run: |
          name=$(cat updater/VERSION)
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          if gh release view "updater-v$name" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build signed APK
        if: steps.v.outputs.exists != 'true'
        working-directory: updater
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon :app:assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          rm -f "$KEYSTORE_PATH"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Release
        if: steps.v.outputs.exists != 'true'
        run: |
          name=${{ steps.v.outputs.name }}
          apk="auto-morphe-$name.apk"
          cp updater/app/build/outputs/apk/release/app-release.apk "$apk"
          printf '{"versionName":"%s","versionCode":%s,"sha256":"%s"}\n' "$name" "${{ steps.v.outputs.code }}" "$(sha256sum "$apk" | cut -d' ' -f1)" > updater.json
          gh release create "updater-v$name" "$apk" updater.json \
            --title "Auto Morphe updater $name" \
            --notes "The Auto Morphe app: install the patched apps and keep them updated. Install this APK on your phone, then open Auto Morphe." \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
